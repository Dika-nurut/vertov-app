# Disposable zero-spend test infrastructure.
#
# This file is intentionally separate from docker/docker-compose.yml: the latter
# is the developer stack and uses persistent host data under /root/seed-prod.
# Never point the test pyramid at that stack. Every service below uses tmpfs and
# alternate host ports so a test reset cannot touch developer or production data.
name: seed-test

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${TEST_POSTGRES_USER:-seedtest}
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:-seed-test-password}
      POSTGRES_DB: ${TEST_POSTGRES_DB:-seed}
    ports:
      - '127.0.0.1:${TEST_PG_PORT:-55434}:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${TEST_POSTGRES_USER:-seedtest} -d ${TEST_POSTGRES_DB:-seed}']
      interval: 2s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    ports:
      - '127.0.0.1:${TEST_REDIS_PORT:-56380}:6379'
    tmpfs:
      - /data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 15

  minio:
    # minio/minio is gone from Docker Hub (and quay.io needs auth); the pinned
    # Bitnami legacy build starts `minio server` itself, console on :9001. Root
    # lets its entrypoint own the tmpfs before it drops to the minio user.
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    user: root
    environment:
      MINIO_ROOT_USER: ${TEST_MINIO_ROOT_USER:-seedtest}
      MINIO_ROOT_PASSWORD: ${TEST_MINIO_ROOT_PASSWORD:-seed-test-password}
    ports:
      - '127.0.0.1:${TEST_MINIO_PORT:-59000}:9000'
      - '127.0.0.1:${TEST_MINIO_CONSOLE_PORT:-59001}:9001'
    tmpfs:
      - /bitnami/minio/data
    healthcheck:
      test:
        [
          'CMD',
          'bash',
          '-c',
          'exec 3<>/dev/tcp/127.0.0.1/9000 && printf "GET /minio/health/live HTTP/1.0\r\n\r\n" >&3 && head -1 <&3 | grep -q " 200 "',
        ]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 60s
